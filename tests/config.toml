[create-image-planar]
field_size_mm = [50.0, 100.0]
sigma_mm = 2.0
gantry_angle = 0.0
epid = "iViewGT"

[analyze-preliminary]
input_dir = "."
output_dir = "."
input_preffix = "preliminary"
output_preffix = "output"
filetype = "csv"
summary = "summary.json"
max_ptp = 1.2
ref_temp = 20.0
devices = "devices.toml"
k = 2


[analyze-image-planar]
protocol = "ELEKTA"
output = "image-report.pdf"

[generate-calibration-report]
output = "calibration-report.pdf"

